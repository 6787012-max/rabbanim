name: upscale-rabbi-photos
on:
  workflow_dispatch:
jobs:
  up:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Real-ESRGAN
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "numpy<2" opencv-python-headless pillow
          pip install --quiet basicsr facexlib gfpgan realesrgan
          python - <<'EOF'
          import basicsr, os, re
          p = os.path.join(os.path.dirname(basicsr.__file__), 'data', 'degradations.py')
          s = open(p).read().replace(
            'from torchvision.transforms.functional_tensor import rgb_to_grayscale',
            'from torchvision.transforms.functional import rgb_to_grayscale')
          open(p,'w').write(s)
          print('basicsr patched')
          EOF
      - name: Upscale
        run: python wf/upscale.py
      - uses: actions/upload-artifact@v4
        with:
          name: upscaled
          path: upscale_out
          retention-days: 7
